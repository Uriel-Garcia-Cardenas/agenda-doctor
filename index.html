<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <title>Agendar cita</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 id="doctor-name">Cargando…</h1>
      <p id="doctor-specialty" class="muted"></p>
    </header>
    <section id="step-date" class="step"></section>
    <section id="step-time" class="step hidden"></section>
    <section id="step-form" class="step hidden"></section>
    <section id="step-done" class="step hidden"></section>
  </main>
  <div id="toast" class="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>s
